# Render Infrastructure-as-Code
# https://render.com/docs/infrastructure-as-code
# Region: Oregon (us-west-2) — matches CEO location and GCS bucket

services:
  - type: web
    name: pls-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: APP_DOMAIN
        value: pls-api.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: GCS_BUCKET
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false

  - type: web
    name: pls-blueprint
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r artifacts/blueprint-pipeline/requirements.txt
    startCommand: python3 artifacts/blueprint-pipeline/main.py
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8099"
      - key: OPENAI_API_KEY
        sync: false
      - key: GCS_BUCKET
        sync: false

databases:
  - name: pls-db
    plan: starter
    region: oregon
    databaseName: pls_production
    user: pls_admin
